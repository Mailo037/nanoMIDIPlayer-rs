name: Release

# Builds the app for Windows, Linux and macOS and publishes it as a GitHub release
# whenever a version tag (e.g. v1.0.0) is pushed. Can also be started by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache per profile; the dist build is LTO-optimized.
          shared-key: dist

      - name: Build (optimized dist profile)
        run: cargo build --profile dist --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-out | Out-Null
          Copy-Item target/dist/nanoMIDIPlayer.exe "dist-out/nanoMIDIPlayer-$env:TAG-windows-x64.exe"
          Compress-Archive -Path target/dist/nanoMIDIPlayer.exe, README.md, LICENSE -DestinationPath "dist-out/nanoMIDIPlayer-$env:TAG-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-out/*

  build-linux:
    # The oldest supported runner, so the binary also starts on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libssl-dev libzstd-dev pkg-config clang cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist

      - name: Build (optimized dist profile)
        run: cargo build --profile dist --locked

      - name: Package
        run: |
          mkdir -p dist-out
          # The bare binary is what the built-in updater downloads.
          cp target/dist/nanoMIDIPlayer "dist-out/nanoMIDIPlayer-$TAG-linux-x64"
          tar -czf "dist-out/nanoMIDIPlayer-$TAG-linux-x64.tar.gz" -C target/dist nanoMIDIPlayer -C "$GITHUB_WORKSPACE" README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-out/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist

      - name: Build for Apple silicon and Intel
        run: |
          cargo build --profile dist --locked --target aarch64-apple-darwin
          cargo build --profile dist --locked --target x86_64-apple-darwin

      - name: Package the app bundle
        run: |
          VERSION="${TAG#v}"
          APP="nanoMIDIPlayer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist-out
          lipo -create -output "$APP/Contents/MacOS/nanoMIDIPlayer" \
            target/aarch64-apple-darwin/dist/nanoMIDIPlayer \
            target/x86_64-apple-darwin/dist/nanoMIDIPlayer

          # App icon from the logo.
          ICONSET="$RUNNER_TEMP/nanoMIDIPlayer.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/loadingLogo.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/loadingLogo.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/nanoMIDIPlayer.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>nanoMIDIPlayer</string>
            <key>CFBundleDisplayName</key><string>nanoMIDIPlayer</string>
            <key>CFBundleIdentifier</key><string>io.github.mailo037.nanomidiplayer</string>
            <key>CFBundleExecutable</key><string>nanoMIDIPlayer</string>
            <key>CFBundleIconFile</key><string>nanoMIDIPlayer</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>10.15.7</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc signature: required to run on Apple silicon, and it keeps the
          # Accessibility permission tied to the app.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist-out/nanoMIDIPlayer-$TAG-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist-out/*

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: nanoMIDIPlayer ${{ env.TAG }}
          generate_release_notes: true
          files: dist-out/*
