name: Release

# Builds the Windows app and publishes it as a GitHub release whenever a
# version tag (e.g. v1.0.0) is pushed. Can also be started by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache per profile; the dist build is LTO-optimized.
          shared-key: dist

      - name: Build (optimized dist profile)
        run: cargo build --profile dist --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force dist-out | Out-Null
          Copy-Item target/dist/nanoMIDIPlayer.exe "dist-out/nanoMIDIPlayer-$tag-windows-x64.exe"
          Compress-Archive -Path target/dist/nanoMIDIPlayer.exe, README.md, LICENSE -DestinationPath "dist-out/nanoMIDIPlayer-$tag-windows-x64.zip"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: nanoMIDIPlayer ${{ env.TAG }}
          generate_release_notes: true
          files: dist-out/*
